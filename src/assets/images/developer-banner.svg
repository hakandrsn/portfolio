  <text x="250" y="67" font-family="monospace" font-size="12" fill="#cccccc">profile.tsx</text>
  
  <!-- Kod Satırları -->
  <text x="60" y="100" font-family="monospace" font-size="12" fill="#569cd6">import</text>
  <text x="105" y="100" font-family="monospace" font-size="12" fill="#c8c8c8">React, { useState, useEffect } </text>
