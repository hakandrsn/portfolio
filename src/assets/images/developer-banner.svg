  <text x="355" y="100" font-family="monospace" font-size="12" fill="#ce9178">'react'</text>
  <text x="405" y="100" font-family="monospace" font-size="12" fill="#c8c8c8">;</text>
  
  <text x="60" y="120" font-family="monospace" font-size="12" fill="#569cd6">import</text>
  <text x="105" y="120" font-family="monospace" font-size="12" fill="#c8c8c8">type { ProfileData } </text>
  <text x="260" y="120" font-family="monospace" font-size="12" fill="#569cd6">from</text>
  <text x="295" y="120" font-family="monospace" font-size="12" fill="#ce9178">'../types/profile'</text>
  <text x="405" y="120" font-family="monospace" font-size="12" fill="#c8c8c8">;</text>
  
  <text x="60" y="150" font-family="monospace" font-size="12" fill="#569cd6">function</text>
  <text x="110" y="150" font-family="monospace" font-size="12" fill="#dcdcaa">Profile</text>
  <text x="155" y="150" font-family="monospace" font-size="12" fill="#c8c8c8">() {</text>
  
  <text x="70" y="170" font-family="monospace" font-size="12" fill="#569cd6">const</text>
  <text x="105" y="170" font-family="monospace" font-size="12" fill="#c8c8c8">[profileData, setProfileData] = </text>
  <text x="300" y="170" font-family="monospace" font-size="12" fill="#dcdcaa">useState</text>
  <text x="350" y="170" font-family="monospace" font-size="12" fill="#c8c8c8"><ProfileData | null>(null);</text>
  
  <text x="70" y="190" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="115" y="190" font-family="monospace" font-size="12" fill="#c8c8c8">(</text>
  <text x="125" y="190" font-family="monospace" font-size="12" fill="#c8c8c8">/* ... */</text>
  <text x="175" y="190" font-family="monospace" font-size="12" fill="#c8c8c8">);</text>
  
  <text x="60" y="210" font-family="monospace" font-size="12" fill="#c8c8c8">}</text>
  
  <text x="60" y="230" font-family="monospace" font-size="12" fill="#569cd6">export</text>
  <text x="105" y="230" font-family="monospace" font-size="12" fill="#569cd6">default</text>
  <text x="155" y="230" font-family="monospace" font-size="12" fill="#c8c8c8">Profile;</text>
  
