<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Arka plan -->
  <rect width="1200" height="300" fill="#2c4a6b" />
  
  <!-- Kod Editörü Görünümü -->
  <rect x="50" y="50" width="500" height="200" rx="5" fill="#1e1e1e" />
  
